# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      # Local-only credential for the dev container; never reuse outside local development
      POSTGRES_PASSWORD: expense
    ports:
      # Bind to localhost only so the dev database is not reachable from the network
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
